version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: recyclink_postgres
    restart: always
    environment:
      POSTGRES_USER: recyclink
      POSTGRES_PASSWORD: recyclink_secure_password_2026
      POSTGRES_DB: recyclink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recyclink -d recyclink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recyclink_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://recyclink:recyclink_secure_password_2026@postgres:5432/recyclink_db
      JWT_SECRET_KEY: recyclink-sih-2026-production-grade-jwt-secret-key-salt
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ENABLE_DEMO_MODE: "true"
      CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
